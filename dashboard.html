<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLXBEE | Elite Lead Gen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00f0ff',
                        surface: '#0b0e14',
                        dark: '#05070a',
                        elite: '#ffcc00',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-border { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        .pulse-yellow { animation: pulse-y 2s infinite; }
        @keyframes pulse-y { 
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px 5px rgba(234, 179, 8, 0.2); }
        }
    </style>
</head>
<body class="bg-dark text-gray-300 font-outfit min-h-screen selection:bg-primary/30" 
      x-data="dashboard()" 
      x-init="init()"
      @keydown.escape="showSearch = false">

    <!-- Sidebar Layout -->
    <div class="flex min-h-screen">
        
        <!-- SIDEBAR -->
        <aside class="w-80 h-screen sticky top-0 border-r border-white/5 bg-surface/50 flex flex-col p-6 overflow-y-auto">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center neon-border">
                    <i data-lucide="zap" class="w-6 h-6 text-black fill-current"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tighter text-white uppercase italic">FLXBEE</h1>
                <div class="ml-auto">
                    <span :class="whatsapp.status === 'connected' ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30'"
                          class="text-[9px] px-2 py-0.5 rounded-full border font-bold uppercase tracking-widest flex items-center gap-1.5">
                        <div class="w-1.5 h-1.5 rounded-full" :class="whatsapp.status === 'connected' ? 'bg-green-400 animate-pulse' : 'bg-red-400'"></div>
                         WhatsApp
                    </span>
                </div>
            </div>

            <!-- FIND LEADS -->
            <div class="space-y-4 mb-8">
                <h3 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold px-2">Find Leads</h3>
                <div class="relative group">
                    <input type="text" 
                           x-model="searchQuery" 
                           placeholder="e.g. Dentists in Mumbai" 
                           class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-3.5 focus:outline-none focus:border-primary/50 transition-all group-hover:border-white/20 text-sm">
                </div>
                
                <div class="flex flex-col gap-3">
                    <button @click="scrapeLeads(true)"
                            class="w-full bg-primary hover:brightness-110 active:scale-95 transition-all text-black font-black py-4 rounded-2xl flex items-center justify-center gap-2 uppercase tracking-wide text-sm shadow-[0_0_20px_rgba(0,240,255,0.2)]">
                        <i data-lucide="sparkles" class="w-4 h-4 fill-current"></i>
                        Find + Auto-Run
                    </button>

                    <button @click="runAll()"
                            class="w-full bg-white/5 hover:bg-white/10 active:scale-95 transition-all text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 uppercase tracking-widest text-[10px] border border-white/5">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                        Run All Queued
                    </button>
                </div>
            </div>

            <!-- STATS -->
            <div class="space-y-4 mb-8">
                <h3 class="text-[10px] uppercase tracking-widest text-gray-500 font-bold px-2">Stats</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="glass p-4 rounded-2xl flex flex-col items-center justify-center">
                        <span class="text-primary text-xl font-black" x-text="stats.total">0</span>
                        <span class="text-[8px] uppercase tracking-widest font-bold text-gray-500">Total Leads</span>
                    </div>
                    <div class="glass p-4 rounded-2xl flex flex-col items-center justify-center border-green-500/20">
                        <span class="text-green-400 text-xl font-black" x-text="stats.completed">0</span>
                        <span class="text-[8px] uppercase tracking-widest font-bold text-gray-500">Completed</span>
                    </div>
                    <div class="glass p-4 rounded-2xl flex flex-col items-center justify-center border-yellow-500/20">
                        <span class="text-yellow-400 text-xl font-black" x-text="stats.inProgress">0</span>
                        <span class="text-[8px] uppercase tracking-widest font-bold text-gray-500">In Progress</span>
                    </div>
                    <div class="glass p-4 rounded-2xl flex flex-col items-center justify-center border-red-500/20">
                        <span class="text-red-400 text-xl font-black" x-text="stats.failed">0</span>
                        <span class="text-[8px] uppercase tracking-widest font-bold text-gray-500">Failed</span>
                    </div>
                </div>
            </div>

            <!-- WHATSAPP STATUS -->
            <div class="mt-auto pt-6 border-t border-white/5">
                <button @click="resetWhatsApp()"
                        class="w-full py-3 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500 hover:text-white transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                    Reset Connection
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-10 flex flex-col gap-8 bg-dark relative overflow-y-auto">
            
            <!-- HEADER -->
            <div class="flex items-end justify-between border-b border-white/5 pb-8">
                <div>
                    <h2 class="text-4xl font-black text-white tracking-tight mb-2 uppercase italic">Elite Pipeline</h2>
                    <div class="flex items-center gap-4">
                        <p class="text-gray-500 text-sm" x-text="activeStatus"></p>
                    </div>
                </div>
                
                <div x-show="whatsapp.qr" 
                     class="glass p-6 rounded-[2.5rem] border-primary/30 flex flex-col items-center gap-6 fixed top-10 right-10 z-[100] shadow-2xl animate-in fade-in zoom-in duration-300">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                        <p class="text-[10px] font-black text-white uppercase tracking-[0.2em]">WhatsApp Login Required</p>
                    </div>
                    
                    <div class="bg-white p-4 rounded-3xl shadow-xl">
                        <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=250x250&format=png&data=' + encodeURIComponent(whatsapp.qr)" 
                             class="w-[200px] h-[200px]"
                             @load="console.log('QR Code Rendered Successfully')">
                    </div>
                    
                    <div class="text-center space-y-2">
                        <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Scan with your phone's WhatsApp</p>
                        <button @click="whatsapp.qr = null" 
                                class="w-full py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-400 text-[9px] uppercase font-black hover:text-white hover:bg-white/10 transition-all">
                            Dismiss
                        </button>
                    </div>
                </div>
            </div>

            <!-- DUAL COLUMN VIEW -->
            <div class="flex gap-10 flex-1 overflow-hidden">
                
                <!-- NEW PROSPECTS -->
                <div class="flex-1 flex flex-col gap-6 overflow-y-auto pr-2 scrollbar-hide">
                    <div class="flex items-center gap-3 sticky top-0 bg-dark/80 backdrop-blur pb-4 z-10">
                        <div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
                        <h3 class="text-xs font-black uppercase tracking-[0.3em] text-white">🔥 New Prospects</h3>
                        <span class="text-[10px] font-bold text-gray-700 ml-auto" x-text="leads.filter(l => !l.reached).length"></span>
                    </div>

                    <div class="grid grid-cols-1 gap-6">
                        <template x-for="(lead, idx) in leads" :key="idx">
                            <div x-show="!lead.reached" 
                                 class="glass rounded-[2.5rem] p-8 flex flex-col gap-6 relative group border border-white/5 hover:border-white/20 transition-all hover:translate-y-[-4px]">
                                
                                <!-- Delete Button -->
                                <button @click="deleteLead(idx)" 
                                        class="absolute top-6 right-6 p-2 text-gray-700 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>

                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 rounded-3xl bg-black border border-white/10 flex items-center justify-center font-black text-primary text-2xl shadow-xl"
                                         x-text="lead.name[0]"></div>
                                    <div class="flex-1 overflow-hidden">
                                        <h3 class="text-lg font-bold text-white truncate" x-text="lead.name"></h3>
                                        <div class="flex items-center gap-2">
                                            <span class="text-[9px] font-black uppercase tracking-widest text-primary/50" x-text="lead.niche"></span>
                                            <span class="text-[9px] text-gray-700">•</span>
                                            <span class="text-xs text-gray-600 font-mono" x-text="lead.phone"></span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Pipeline Steps -->
                                <div class="flex items-center gap-2 px-2">
                                    <template x-for="(status, sIdx) in [
                                        {label: 'Build', key: 'building', check: 'html_file'},
                                        {label: 'Record', key: 'recording', check: 'video_file'},
                                        {label: 'Send', key: 'queuing', check: 'reached'}
                                    ]" :key="sIdx">
                                        <div class="flex items-center gap-2">
                                            <div class="flex flex-col items-center gap-2">
                                                <div class="w-10 h-10 rounded-2xl flex items-center justify-center border transition-all duration-500"
                                                     :class="{
                                                         'bg-green-500/20 border-green-500 text-green-400 shadow-[0_0_10px_rgba(34,197,94,0.3)]': sIdx === 0 ? lead.html_file : (sIdx === 1 ? lead.video_file : lead.reached),
                                                         'bg-yellow-500/10 border-yellow-500/50 text-yellow-400 pulse-yellow': lead.status === status.key,
                                                         'bg-surface border-white/10 text-gray-700': !(lead.status === status.key) && !(sIdx === 0 ? lead.html_file : (sIdx === 1 ? lead.video_file : lead.reached))
                                                     }">
                                                    <i :data-lucide="sIdx === 0 ? 'globe' : (sIdx === 1 ? 'video' : 'send')" class="w-4 h-4"></i>
                                                </div>
                                                <span class="text-[8px] uppercase font-black tracking-widest" x-text="status.label"></span>
                                            </div>
                                            <div x-show="sIdx < 2" class="w-4 h-[1px] bg-white/10 -mt-6"></div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Actions Grid -->
                                <div class="grid grid-cols-1 gap-2 mt-2">
                                    <button @click="doAction(idx, 'run')" 
                                            class="bg-primary hover:brightness-110 p-3 rounded-2xl text-black font-black text-[10px] uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.1)] flex items-center justify-center gap-2">
                                        <i data-lucide="zap" class="w-4 h-4"></i>
                                        Master Mission
                                    </button>
                                    <div class="grid grid-cols-2 gap-2">
                                        <button @click="doAction(idx, 'generate')" class="bg-white/5 border border-white/10 p-3 rounded-2xl text-gray-400 font-bold text-[10px] uppercase tracking-widest hover:text-white">Build Site</button>
                                        <button @click="doAction(idx, 'record')" class="bg-white/5 border border-white/10 p-3 rounded-2xl text-gray-400 font-bold text-[10px] uppercase tracking-widest hover:text-white">Record Video</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        
                        <!-- Empty New Leads -->
                        <div x-show="leads.filter(l => !l.reached).length === 0" class="glass rounded-[2.5rem] p-12 border-dashed border-white/5 flex flex-col items-center justify-center opacity-20">
                            <i data-lucide="search" class="w-8 h-8 mb-4"></i>
                            <span class="text-[10px] font-black uppercase tracking-widest">No active prospects</span>
                        </div>
                    </div>
                </div>

                <!-- REACHED LEADS -->
                <div class="w-96 flex flex-col gap-6 overflow-y-auto scrollbar-hide border-l border-white/5 pl-8">
                    <div class="flex items-center gap-3 sticky top-0 bg-dark/80 backdrop-blur pb-4 z-10">
                        <h3 class="text-xs font-black uppercase tracking-[0.3em] text-gray-500">✅ Previously Reached</h3>
                        <span class="text-[10px] font-bold text-gray-700 ml-auto" x-text="leads.filter(l => l.reached).length"></span>
                    </div>

                    <div class="flex flex-col gap-4">
                        <template x-for="(lead, idx) in leads" :key="'reached'+idx">
                            <div x-show="lead.reached" 
                                 class="glass rounded-3xl p-5 border border-green-500/10 flex items-center gap-4 opacity-70 hover:opacity-100 transition-opacity">
                                <div class="w-10 h-10 rounded-xl bg-green-500/20 flex items-center justify-center font-black text-green-400 text-sm"
                                     x-text="lead.name[0]"></div>
                                <div class="flex-1 overflow-hidden">
                                    <h3 class="text-sm font-bold text-white truncate" x-text="lead.name"></h3>
                                    <p class="text-[10px] text-gray-600 font-mono" x-text="lead.phone"></p>
                                </div>
                                <div class="w-6 h-6 rounded-full bg-green-500 text-black flex items-center justify-center">
                                    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[4]"></i>
                                </div>
                            </div>
                        </template>
                        
                        <!-- Empty Reached -->
                        <div x-show="leads.filter(l => l.reached).length === 0" class="p-8 text-center opacity-10">
                            <span class="text-[10px] font-black uppercase tracking-widest">No reached leads yet</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- LOGS COMPONENT -->
            <div class="mt-auto">
                <div class="glass rounded-[2rem] p-6 border-b-0 rounded-b-none bg-surface/50">
                    <div class="flex items-center justify-between mb-4 px-2">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                            <h3 class="text-[10px] font-black uppercase tracking-widest text-white">Live Logs</h3>
                        </div>
                        <button @click="clearLogs()" class="text-[9px] font-bold text-gray-500 hover:text-red-400 uppercase tracking-widest">clear</button>
                    </div>
                    <div class="h-40 overflow-y-auto font-mono text-[11px] space-y-1 scrollbar-hide px-2 border-l border-white/5" x-ref="logBox">
                        <template x-for="(log, i) in logs" :key="i">
                            <div class="flex gap-4">
                                <span class="text-gray-600 shrink-0" x-text="log.time"></span>
                                <span :class="{
                                    'text-green-400': log.msg.includes('[SUCCESS]'),
                                    'text-blue-400': log.msg.includes('[MISSION]') || log.msg.includes('[WORKFLOW]'),
                                    'text-yellow-500': log.msg.includes('[SCRAPER]'),
                                    'text-red-400': log.msg.includes('[ERROR]') || log.msg.includes('failed'),
                                    'text-primary font-bold': log.msg.includes('complete'),
                                    'text-gray-400': !log.msg.includes('[')
                                }" x-text="log.msg"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function dashboard() {
            return {
                leads: [],
                logs: [],
                whatsapp: { status: 'disconnected', qr: null },
                searchQuery: '',
                loading: false,
                activeStatus: 'Search for a niche to get started',
                stats: { total: 0, completed: 0, inProgress: 0, failed: 0 },

                async init() {
                    console.log("FLXBEE_DASHBOARD: V1.4 ELITE READY");
                    lucide.createIcons();
                    this.poll();
                    setInterval(() => this.poll(), 2500);
                },

                async poll() {
                    try {
                        const leadsRes = await fetch(`/leads?t=${Date.now()}`);
                        const rawLeads = await leadsRes.json();
                        if (rawLeads && Array.isArray(rawLeads)) {
                            this.leads = rawLeads;
                            this.calculateStats();
                        }

                        const logsRes = await fetch(`/logs?t=${Date.now()}`);
                        let rawLogs = await logsRes.json();
                        
                        // Handle both formats: [log1, log2] OR { logs: [log1, log2] }
                        let finalLogsArray = Array.isArray(rawLogs) ? rawLogs : (rawLogs && rawLogs.logs ? rawLogs.logs : null);
                        
                        if (finalLogsArray && Array.isArray(finalLogsArray)) {
                            this.logs = finalLogsArray.map(l => {
                                const parts = l.split(' :: ');
                                return { time: parts[0], msg: parts[1] || parts[0] };
                            });
                        } else {
                            console.warn("LOGS_FORMAT_ERROR:", rawLogs);
                        }

                        const waRes = await fetch(`/whatsapp/status?t=${Date.now()}`);
                        const waData = await waRes.json();
                        if (waData) this.whatsapp = waData;

                        // Scroll logs to bottom if new
                        this.$nextTick(() => {
                            lucide.createIcons();
                            const box = this.$refs.logBox;
                            if(box) box.scrollTop = box.scrollHeight;
                        });

                        // Update active status based on logs
                        const lastMissionLog = this.logs.find(l => l.msg.includes('[MISSION]'));
                        if (lastMissionLog) this.activeStatus = lastMissionLog.msg.replace('[MISSION] ', '');

                    } catch (e) {
                        console.error("Polling error:", e);
                    }
                },

                calculateStats() {
                    this.stats.total = this.leads.length;
                    this.stats.completed = this.leads.filter(l => l.status === 'completed').length;
                    this.stats.failed = this.leads.filter(l => l.status && l.status.includes('failed')).length;
                    this.stats.inProgress = this.leads.filter(l => ['building', 'recording', 'queuing'].includes(l.status)).length;
                },

                async scrapeLeads(isAuto = false) {
                    if (!this.searchQuery) return alert("Enter a niche first!");
                    this.loading = true;
                    this.activeStatus = `Scraping leads for "${this.searchQuery}"...`;
                    let url = `/scrape?query=${encodeURIComponent(this.searchQuery)}`;
                    if (isAuto) url += '&live=true';
                    
                    await fetch(url, { method: 'POST' });
                    this.searchQuery = '';
                    setTimeout(() => { this.loading = false; }, 3000);
                },

                async doAction(idx, action) {
                    this.activeStatus = `${action} initiated for lead at index ${idx}...`;
                    await fetch(`/${action}/${idx}`, { method: 'POST' });
                },

                async runAll() {
                    this.activeStatus = "Initiating Master Automation for all leads...";
                    await fetch('/run_all', { method: 'POST' });
                },

                async deleteLead(idx) {
                    if(!confirm("Delete this lead?")) return;
                    await fetch(`/leads/${idx}`, { method: 'DELETE' });
                    await this.poll();
                },

                async clearLogs() {
                    await fetch('/logs/clear', { method: 'POST' });
                    this.logs = [];
                },

                async resetWhatsApp() {
                    if(!confirm("Hard reset WhatsApp session?")) return;
                    await fetch('/whatsapp/reset', { method: 'POST' });
                }
            }
        }
    </script>
</body>
</html>
